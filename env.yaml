# Full environment for the outreach-talks monorepo. scripts/bootstrap.sh makes it
# with micromamba under $OUTREACH_PREFIX; by hand:
#   conda env create -f env.yaml
#   conda activate outreach_talks
#   pnpm install                      # installs all talks' deps (incl. slidev-addon-videos)
#   cd talks/<name> && pnpm dev       # start the dev server for a talk
name: outreach_talks
channels:
  - conda-forge
dependencies:
  - python>=3.11   # tomllib requires 3.11+
  - pip
  - ffmpeg         # encode / remux (NVENC build on this machine)
  - rclone         # videos:sync from gdrive
  - gh             # GitHub Releases
  - nodejs>=20,<25 # runtime for slidev (24 LTS, as the talks are built with)
  - pnpm>=10,<11   # package manager; installs @slidev/cli per-project. Not 11+: they
                   # use another store and fail the install on unapproved build scripts
  - numpy          # orbital rendering / Manim deps
  - scipy          # spherical harmonics for orbital animation
  - matplotlib     # 3D plotting for orbital animation
  - pip:
      - "slidev-videos @ git+https://github.com/MindaugasSarpis/slidev-videos@v0.4.0"
