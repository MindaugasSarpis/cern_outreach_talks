notes   = "CERN video 2019-050-008, HEVC 6 Mbps 1080p silent."

[[videos]]
name    = "Voyage_in_to_the_world_of_atoms.mp4"
profile = "remux"
notes   = "CERN zoom-from-cosmos-to-quarks reel, 2:01 silent. Source already web-friendly."

[[videos]]
name    = "LHCb.mp4"
profile = "standard"
notes   = "LHCb overview, 48s with audio."

[[videos]]
