# Shared video registry for the outreach-talks monorepo.
#
# Lists clips that live in a shared GitHub Release and are inherited by
# multiple talks. Talks reference these by filename in their decks; the
# pipeline does NOT download or re-encode them when working on an
# individual talk — they're served at runtime via VideoPlayer's
# fallback chain (… → talk release → shared release).
#
# Profiles, hq_from_raw, etc. follow the same schema as a talk's
# videos/manifest.toml. See scripts/videos.py for details.
#
# release_tag / release_tag_hq: which GH Release(s) hold these assets.
# We currently reuse the editAI release as the de-facto shared release
# (it already holds web-encoded copies of all the external clips).
# When a dedicated `videos-shared` release is later established, point
# these tags at it and republish.

[defaults]
release_tag    = "videos-2026-04-28-editai"
release_tag_hq = "videos-hq-2026-04-28-editai"
source_remote  = "gdrive:Work/Outreach/Resources/Videos/released"
long_edge_px   = 2880   # current shared encodes were produced for editAI's
                        # 2880 venue. Raise to 3840 once a dedicated shared
                        # release is republished for 4K venues.

# ---------------------------------------------------------------------------
