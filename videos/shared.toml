# Shared video registry for the outreach-talks monorepo.
#
# Lists clips that live in a shared GitHub Release and are inherited by
# multiple talks. Talks reference these by filename in their decks; the
# pipeline does NOT download or re-encode them when working on an
# individual talk — they're served at runtime via VideoPlayer's
# fallback chain (… → talk release → shared release).
#
# Profiles, hq_from_raw, etc. follow the same schema as a talk's
# videos/manifest.toml. See scripts/videos.py for details.
#
# release_tag: which GH Release holds these assets. Since 2026-07-18 that
# is the dedicated `videos-shared` release. The old host
# (videos-2026-04-28-editai) keeps a full copy as a frozen archive —
# listed in archive_release_tags so publish/pull --prune never deletes
# shared-named assets from it.

[defaults]
release_tag    = "videos-shared"
archive_release_tags = ["videos-2026-04-28-editai"]
# release_tag_hq intentionally unset: the HQ release
# (videos-hq-2026-04-28-editai, 2880x1600 HEVC venue masters) was deleted
# on 2026-07-18 — the 9:5 format is rare and 4K/HEVC HQ playback froze at
# the Yaga venue. The web tier (1080p-class H.264) is canonical now;
# regenerate masters from the gdrive raws if a venue ever needs them.
source_remote  = "gdrive:work/outreach/resources/videos/released"  # ALL lowercase
long_edge_px   = 2880   # historical: current shared encodes were produced
                        # for editAI's 2880 venue.

