# Talk-OWNED video assets for the editAI talk.
#
# This talk currently owns NO clips: everything its deck references —
# generic CERN/LHC/B-roll footage, the crash-course chart renders, and the
# Mokslo Sala venue clips — lives in the shared registry
# (/videos/shared.toml) and is served at runtime via VideoPlayer's fallback
# chain. editAI's own GH Release (videos-2026-04-28-editai) doubles as the
# shared release, so "inherited" clips still resolve to assets this talk
# originally published; publish/pull --prune protects shared-registry
# entries from deletion.
#
# To take ownership of a clip again (e.g., a venue-specific re-encode),
# add a [[videos]] entry here and encode/publish as usual — the talk
# release wins VideoPlayer's fallback chain over shared.
#
# Profiles (in scripts/videos.py):
#   remux          - lossless stream copy + faststart. For clips already in a
#                    web-friendly codec (H.264, or low-bitrate HEVC).
#   standard       - web H.264 CRF 23 (<=6 Mbps), AAC 128k.
#   standard-tight - web H.264 CRF 26 (<=3.5 Mbps) for long clips.
#   silent-loop    - web H.264 CRF 24 (<=5 Mbps), audio stripped. Loops.
#   high-motion    - web H.264 CRF 22 (<=8 Mbps), AAC 192k. Sims/CGI/fast.
# (The HQ venue-master tier is HEVC CRF 16 regardless of profile.)

[defaults]
source_remote = "gdrive:work/outreach/resources/videos/released"  # ALL lowercase
long_edge_px  = 2880   # venue screen is 2880x1600; override global 1920

# release_tag auto-derives from talk dirname.
# max_size_mb inherited from /outreach.toml.
