# Talk-OWNED clips only. Clips from the slidev-videos library
# (https://github.com/MindaugasSarpis/slidev-videos, src/slidev_videos/shared.toml)
# are inherited by name — reference them in the deck, never list them here.
#
# POLICY (since 2026-07-18): venues play the 1080p H.264 web tier, loudness
# -16 LUFS. No HQ tier. Run `pnpm videos:preflight` before the talk.
# Profiles: remux | standard | standard-tight | silent-loop | high-motion

[defaults]
# release_tag comes from videos.toml (videos-2026-00-00-data5open).

# [[videos]]
# name    = "example_clip.mp4"
# profile = "standard"
# used_in = ["deck"]
# notes   = "What this clip is and where it came from."

[[videos]]
name    = "cern_footage_2022_014_001_datacentre.mp4"
profile = "standard"
used_in = ["deck"]
trim    = ["0:28", "0:38.7"]
notes   = """\
The record part: the CERN Data Centre, 10.7 s. Source: videos.cern.ch record 3020288 \
(https://videos.cern.ch/record/3020288), CERN-FOOTAGE-2022-014-001, "Data Centre Footage \
2022", dated 2022-07-04, 44 s, licence "CERN" (copyright.web.cern.ch); no on-screen credit. \
Raw: the record's 1080p.mp4 subformat (the master is a 1.3 GB 1080p .mov; same frame size), \
as is. Why this cut: the source's dark, blue-lit stretch with nobody in frame (a person walks \
the aisles at 0:04-0:09 and 0:22-0:27, so those are out): 0:28-0:31 rack fronts close up, \
green and blue LEDs; 0:32-0:33 an aisle opening onto a lit corridor; 0:34-0:38.7 a rack row \
with bright blue status bars, the last frame. Cut at 0:38.7 (motion review, 2026-10-29): the \
source cuts to a long dark aisle of LEDs at 0:38.84, a shot barely seen before the clip's dust \
exit, which flashed as a pop (a 5.3 luma jump). Dark \
frames sit on the classic palette's near-black and carry "a hall of disks", the scale the \
piles of 1 TB stand for. No burnt-in titles, captions or logos."""

