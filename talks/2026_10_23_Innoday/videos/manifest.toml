# Talk-OWNED clips only. Clips from the slidev-videos library
# (https://github.com/MindaugasSarpis/slidev-videos, src/slidev_videos/shared.toml)
# are inherited by name — reference them in the deck, never list them here.
#
# POLICY (since 2026-07-18): venues play the 1080p H.264 web tier, loudness
# -16 LUFS. No HQ tier. Run `pnpm videos:preflight` before the talk.
# Profiles: remux | standard | standard-tight | silent-loop | high-motion

[defaults]
# release_tag comes from videos.toml (videos-2026-10-00-innoday).
max_size_mb = 320   # nftmc_zoom_web (4:13; vu_zoom_web's 2:47 was 138 MB at 6.6 Mbit/s); 320 was set for vu_ff_zoom_galaxy (4:26, 305 MB), no longer in the deck

# vu_ff_zoom.mp4 (the whole 4:42 zoom-out, 253 MB) is the source of the cut
# below. The deck no longer plays it, so it is not listed; its asset stays on
# the release (do not publish with --prune: this and the two old clips below
# keep their assets).

# vu_ff_zoom_galaxy.mp4 (high-motion): no longer in the deck (12 Oct); its asset
# stays on the release. Its notes: The opener until the owner's orbit clip
# exists: vu_ff_zoom.mp4 cut at 4:26, before its last 16 s fade to black, so it
# ends on our galaxy seen from the side and the takeover slide can start from
# that real frame (public/figures/opener_last.jpg, pnpm takeover:frame). Made
# from the 1080p web encode (not the raw): ffmpeg -t 266, h264_nvenc VBR
# ~7 Mbit/s, 3 s audio fade-out at the end.

# vu_ff_unzoom.mp4 (high-motion): no longer in the deck (12 Oct); its asset stays
# on the release. Its notes: The bookend („…ir atgal“): vu_ff_zoom_galaxy.mp4
# reversed and sped up 8.87x to 30 s, silent, from our galaxy back past Earth and
# Lithuania to the VU Faculty of Physics in Saulėtekis (the Google Earth credit
# is in the footage). Made from the 1080p web encode by
# ~/talks/.cache/innoday/unzoom/make.sh (5 s segments reversed and joined in
# reverse order); the raw is that output, not on gdrive.

# vu_zoom_web.mp4 (high-motion): no longer in the deck (13 Oct); its asset stays
# on the release. Its notes: the opener from 12 to 13 Oct, the owner's
# SpaceEngine edit spaceengine/vm_zoom.mp4 (4:11) cut at 167.4 s, before its
# crossfade into the CMB, with a 3 s audio fade-out; it started over the VU
# Business School roof in Saulėtekis and ended on the frame the takeover starts
# from (public/figures/opener_last.jpg).

# Fetch raws one at a time, never with a plain `videos:sync`: it is an rclone
# sync of every name listed here, so it would DELETE nftmc_zoom_web.mp4's raw
# (cut here, not on gdrive released/) and fetch lhcb.mp4's 112 MiB raw, which
# nothing here encodes. A raw on released/: rclone copyto
# gdrive:work/outreach/resources/videos/released/<name> ../../videos/raw/<name>
# --checksum. nftmc_zoom_web.mp4's: copy its source the same way (its notes) and
# cut it again with the command there.
[[videos]]
name    = "nftmc_zoom_web.mp4"
profile = "high-motion"
used_in = ["deck"]
notes   = """\
The opener (owner, 13 Oct: "the last frame will be the same, the beginning \
will be not from business school but nftmc"): the owner's SpaceEngine edit \
spaceengine/nftmc_zoom.mp4 (gdrive:work/outreach/resources/videos/spaceengine/, \
4:27.6, 1080p60 HEVC, a Resolve render) cut at 253.45 s, with a 3 s audio \
fade-out. It starts over NFTMC in Saulėtekis (Google Earth: its attribution \
is in the footage, the "Google Earth" logo on every Earth frame and the \
imagery providers where theirs is shown, "Landsat / Copernicus" ~0:20, \
"Airbus, CNES / Airbus, Maxar Technologies" ~0:26) and ends on the \
cosmic web (the NCSA AVL 'Cosmic Bubble Bath' visualisation) at the frame the \
takeover starts from: 253.40-253.43 s matches public/figures/opener_last.jpg \
(the old opener's last frame) best, normalised correlation 0.996 (its \
neighbours 0.995, falling off either side). After it the source runs on: the \
web keeps evolving, hazier and brighter, to ~259.5 s, then holds that frame to \
the end; both are cut. ~205-225 s is near-black flight between the galaxies. \
The raw is that cut, 60 fps kept, made by: ffmpeg -i nftmc_zoom.mp4 -t 253.45 \
-map 0:v:0 -map 0:a:0 -map_metadata -1 -write_tmcd 0 -c:v libx264 -preset slow \
-crf 14 -profile:v high -pix_fmt yuv420p -af afade=t=out:st=250.45:d=3 -c:a \
aac -b:a 256k -movflags +faststart nftmc_zoom_web.mp4 (in pnpm talk render). \
Not on gdrive released/, so a plain videos:sync would delete it: fetch raws \
with rclone copyto, as the comment above says."""

[[videos]]
name     = "cern_footage_2022_013_001_1080p_lhc.mp4"
profile  = "high-motion"
used_in  = ["deck"]
trim     = ["3:00", "3:39.5"]
loudnorm = false
notes    = """\
The LHC numbers slide: the real LHC tunnel, CERN-FOOTAGE-2022-013-001 (the \
library's cern_footage_2022_013_001.mp4, full 4:13), from its 1080p raw, cut to \
39.5 s of its third shot: one continuous move along the dipoles on the right, \
teal at first, past the warm-lit wall, then the blue dipoles with the white \
'LHC' and 'CERN' letters; it stops on 'CERN' (a lit last frame for the dust \
exit), just before the 3:40 darkening. The four LHC numbers sit over it on \
their dark card ground. OpenData's and Užsikrauk karjerai's opening is \
2:35-2:53 of the same shot, so this cut does not repeat it. Named as its raw \
on gdrive (released/cern_footage_2022_013_001_1080p_lhc.mp4) so videos:sync \
finds it. Its sound is the tunnel's own ventilation hum, kept at the source's \
level (loudnorm off)."""

# A library clip, listed only for its print poster: its first lit frame is the
# detector a speck on black, 0:24 is the whole detector in its cavern. Not
# encoded here, and NEVER published: the deck plays the shared release's copy,
# so publish only with --only <talk-owned names> (a plain publish would upload
# a local copy of it to this talk's release, which wins the chain).
[[videos]]
name   = "lhcb.mp4"
poster = "0:24"
