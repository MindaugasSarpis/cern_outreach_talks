# Talk-OWNED clips only. Clips from the slidev-videos library
# (https://github.com/MindaugasSarpis/slidev-videos, src/slidev_videos/shared.toml)
# are inherited by name — reference them in the deck, never list them here.
#
# POLICY (since 2026-07-18): venues play the 1080p H.264 web tier, loudness
# -16 LUFS. No HQ tier. Run `pnpm videos:preflight` before the talk.
# Profiles: remux | standard | standard-tight | silent-loop | high-motion

[defaults]
# release_tag comes from videos.toml (videos-2026-00-00-data1trigger).

# [[videos]]
# name    = "example_clip.mp4"
# profile = "standard"
# used_in = ["deck"]
# notes   = "What this clip is and where it came from."

[[videos]]
name    = "atlas_footage_2024_001_001_pileup.mp4"
profile = "high-motion"
used_in = ["deck"]
trim    = ["0:22.4", "0:34"]
notes   = """\
Forty million a second (bible T1): ATLAS's animated event display of a pile-up \
bunch crossing, run 352514, event 1031263761, recorded 12 June 2018 (a di-muon \
Z candidate plus two dijet pile-up vertices). ATLAS's display, named as ATLAS in \
the slide notes. Record https://videos.cern.ch/record/2300480, \
ATLAS-FOOTAGE-2024-001-001, dated 2024-08-06, licence "CERN" on the record, no \
on-screen credit. Raw: the record's master mp4 (1920x1080 HEVC, 30 fps, 45.2 s, \
40 MB) renamed to this name in videos/raw/. Cut 22.4-34.0 s: starts inside the \
burst of tracks, on a lit frame (mean luma about 120; the raw is dark, 13, until \
22.07 s, after the 21-21.9 s black-with-red-dots transition), so the dust gathers \
into a lit picture (motion review, 29 Oct; 22.0 opened on black); pulls back through the starburst of tracks and calorimeter deposits \
(25-29.5 s), out until the crossing is a speck inside the detector (30-31.5 s), \
the whole ATLAS wireframe (32 s), then inside it along the beam (32.5-34 s), so \
the last frame is the detector, not tracks, for the cut to the world. The small \
ATLAS Experiment logo (bottom right) is burnt into every frame of the source; \
no frame is free of it."""

[[videos]]
name    = "cern_footage_2020_042_001_tape_library.mp4"
profile = "standard"
used_in = ["deck"]
trim    = ["0:07", "0:19"]
notes   = """\
Archive (bible T1): time-lapse of the Spectra Logic TFinity tape library being \
installed in the CERN Data Centre in August 2020 (LTO, 15 000 cartridge slots, \
up to 48 drives, five working days, per the record). Record \
https://videos.cern.ch/record/2728761, CERN-FOOTAGE-2020-042-001, dated \
2020-08-25, licence "CERN" on the record, no on-screen credit. Raw: the record's \
2160p.mp4 (3840x2160 H.264, 25 fps, 60.4 s, 156 MB) renamed to this name in \
videos/raw/. Cut 7.0-19.0 s: starts on the shot change after the 0-6.9 s opening \
(two people facing camera, then the finished blue CERN wrap); the bare rows of \
empty cartridge racks are aligned and closed up into one long wall, with fitters \
small and mostly turned away; two fitters come close for about one second around \
18 s. The last frame (19 s) is the empty, finished row of racks with nobody in \
it. Avoids the 'Data CERN' title and CERN logo burnt in from about 52 s and the \
close masked faces of 33-42 s. The web copy's last 0.6 s are darkened to 30 % \
(videos/dim_tail.sh, after the encode): the room is bright throughout, and its dust \
flashed white as slide 12 opened (motion review, 29 Oct)."""
