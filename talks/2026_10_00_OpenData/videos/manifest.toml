# Talk-OWNED clips only. Clips from the slidev-videos library
# (https://github.com/MindaugasSarpis/slidev-videos, src/slidev_videos/shared.toml)
# are inherited by name — reference them in the deck, never list them here.
#
# POLICY (since 2026-07-18): venues play the 1080p H.264 web tier, loudness
# -16 LUFS. No HQ tier. Run `pnpm videos:preflight` before the talk.
# Profiles: remux | standard | standard-tight | silent-loop | high-motion

[defaults]
# release_tag comes from videos.toml (videos-2026-10-00-opendata).

# [[videos]]
# name    = "example_clip.mp4"
# profile = "standard"
# used_in = ["deck"]
# notes   = "What this clip is and where it came from."

[[videos]]
name    = "lhcb.mp4"
profile = "standard"
used_in = ["deck"]
trim    = ["0:08", "0:47.1"]
notes   = """\
Kick-off: the library's LHCb reel (the detector in 3D, with music), cut for \
the dust transition. The library copy opens on 8 s of a dark tunnel and ends \
on black; the player builds a clip's arriving grains from its first frame and \
its leaving grains from the last one on screen, and a black frame gives \
nothing to see. This cut starts at the shafts above the cavern (white CG on \
black, drawn by the grains with videos.dustFrom: start) and ends on the \
detector as the music fades, before the black tail. Same name as the library clip, so this \
talk's release wins the chain. Raw: gdrive released/lhcb.mp4 (117 MB)."""

[[videos]]
name     = "cern_footage_2022_013_001_1080p_lhc.mp4"
profile  = "high-motion"
used_in  = ["deck"]
trim     = ["2:35", "2:53"]
loudnorm = false
notes    = """\
The opening (components/lhc-opening/): the real LHC tunnel, CERN-FOOTAGE-2022-013-001, \
the library's cern_footage_2022_013_001.mp4 from its 1080p raw, cut to 18 s of the \
travelling shot with the magnets on the right and the beam line vanishing near \
(0.44, 0.40) of the frame, where the camera goes on into the beam pipe. Named as \
its raw on gdrive (released/cern_footage_2022_013_001_1080p_lhc.mp4) so \
videos:sync finds it. Its sound is the tunnel's own ventilation hum, kept at the \
source's level (loudnorm off), not lifted to -16 LUFS."""
