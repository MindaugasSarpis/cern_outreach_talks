# Talk-OWNED clips only. Clips from the slidev-videos library
# (https://github.com/MindaugasSarpis/slidev-videos, src/slidev_videos/shared.toml)
# are inherited by name — reference them in the deck, never list them here.
#
# POLICY (since 2026-07-18): venues play the 1080p H.264 web tier, loudness
# -16 LUFS. No HQ tier. Run `pnpm videos:preflight` before the talk.
# Profiles: remux | standard | standard-tight | silent-loop | high-motion

[defaults]
# release_tag comes from videos.toml (videos-2026-10-26-uzsikraukkarjerai).

# [[videos]]
# name    = "example_clip.mp4"
# profile = "standard"
# used_in = ["deck"]
# notes   = "What this clip is and where it came from."

[[videos]]
name    = "lhcb.mp4"
profile = "standard"
used_in = ["deck"]
trim    = ["0:08", "0:47.1"]
notes   = """\
The shared opening's LHCb reel (the detector in 3D, with music), the same cut \
as OpenData's (its manifest, 2026-10-10): from the shafts above the cavern to \
the detector as the music fades, without the library copy's 8 s of dark tunnel \
at the start or its black tail. Same name as the library clip, so this talk's \
release wins the chain. Raw: gdrive released/lhcb.mp4 (117 MB)."""

[[videos]]
name     = "cern_footage_2022_013_001_1080p_lhc.mp4"
profile  = "high-motion"
used_in  = ["deck"]
trim     = ["2:35", "2:53"]
loudnorm = false
notes    = """\
The shared opening (components/lhc-opening/): the real LHC tunnel, CERN-FOOTAGE-2022-013-001, \
the same 18 s cut as OpenData's (its manifest): the travelling shot with the magnets on the \
right; on its last frame the magnet string vanishes at (0.45, 0.53), where the camera goes on \
into the beam pipe. Named as its raw on gdrive (released/cern_footage_2022_013_001_1080p_lhc.mp4) \
so videos:sync finds it. Its sound is the tunnel's own ventilation hum, kept at the source's \
level (loudnorm off)."""

[[videos]]
name    = "cern_video_2019_050_008.mp4"
profile = "standard"
used_in = ["deck"]
trim    = ["0:00", "0:10.8"]
notes   = """\
The LHC dipole (owner, 21 Oct: "can show magnet video from CERN"; cut A, "A, ok"): \
CERN-VIDEO-2019-050-008, its first 10,8 s (it dissolves into the next scene at 11 s), a cutaway of an LHC dipole magnet into its two \
beam pipes (its small English/French labels kept, the owner's "ok"); the rest of the \
film is the beam vacuum. Silent (no audio stream; two data tracks dropped). Same name as \
the library clip (full length), so this talk's release wins the chain. Raw: the Drive \
clip folder's cern_video_2019_050_008_1080ph265.mp4 (HEVC, 72 MB), copied into the raw \
bank under this name."""

[[videos]]
name    = "vilnius_zoom.mp4"
profile = "high-motion"
used_in = ["deck"]
loudnorm = false
notes   = """\
The zoom out on slide 2 (the owner, 23 Oct, through the Scheduler: "Can we do a \
quick zoomout from vilnius straight to universe web - in 20s"; then "Silent", "also \
needs stabilization": the wobble is the source's, "but on speedup it doesn't look \
good"): Innoday's opener, the owner's SpaceEngine edit spaceengine/nftmc_zoom.mp4 \
(gdrive:work/outreach/resources/videos/spaceengine/, 4:27.6, 1080p60 HEVC), made 17 s at \
50 fps by scripts/remap_zoom.py: four stretches at eased speeds joined by 0.4 s \
dissolves (Google Earth from NFTMC out to the clouds, 0-32.4 s; the Earth from space, \
37.6-62, its 95-degree roll dissolved over, the cloud tops toned down; the galaxy \
whole, 186-196; the web, \
226-253.42, braking to a stop, its last frame held 1 s), the camera's screen-wide \
sways between them dissolved over; each stretch stabilised onto a smooth path within \
a corridor of the real one (crop zoom at most 1.12), from zoom_motion.py's per-frame \
motion (videos/raw/spaceengine/nftmc_zoom.motion.npy; OpenCV). It ends on the source's \
frame at 253.42 s, Innoday's cut point, so it matches public/figures/opener_last.jpg \
(slide 3's still). No audio (a swoosh for it, scripts/zoom_swoosh.py, is the owner's \
"maybe"). Google Earth (NFTMC to the clouds, 0-5.4 s): its attribution, the logo and \
the imagery providers ("Landsat / Copernicus", "Airbus, CNES / Airbus, Maxar \
Technologies"), is put back over the moved frame unmoved and uncropped (a matte of \
its letters only, so the picture round them stays stabilised); the web: NCSA \
Advanced Visualization Lab ("Cosmic Bubble Bath"). The raw (videos/raw/vilnius_zoom.mp4) \
is that output, not on gdrive released/: never run a plain videos:sync here (it would \
delete it); make it again with the script."""

[[videos]]
name    = "lis_flag_50.mp4"
profile = "high-motion"
used_in = ["deck"]
notes   = """\
Slide 15 since 24 Oct (the owner: "Slide 15 framerate could be better"): Innoday's lis_flag.mp4 \
(its entry, with its notes, left this manifest on 24 Oct; git history has it), its 3,5-20 s motion-interpolated from its 25 fps render to 50 fps (no Blender \
scene on this machine to render it again): ffmpeg -ss 3.5 -t 16.5 -i videos/raw/lis_flag.mp4 \
-an -vf minterpolate=fps=50:mi_mode=mci:mc_mode=aobmc:me_mode=bidir:vsbmc=1 -crf 14; the \
high-motion profile (the silent-loop copy was 1,4 Mbit/s). The raw (videos/raw/lis_flag_50.mp4) \
is that output, not on gdrive released/: make it again with the command."""

