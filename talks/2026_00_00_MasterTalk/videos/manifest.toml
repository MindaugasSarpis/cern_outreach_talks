[[videos]]
name      = "vilnius_zoom.mp4"
profile   = "remux"
used_in   = ["deck"]
generated = true
notes     = """\
The zoom out from NFTMC in Saulėtekis past the Earth and our galaxy to the cosmic web, \
49 s at 50 fps: Karjera's remap (its scripts/remap_zoom.py, 25 Oct) of the owner's \
SpaceEngine edit for Innoday, stabilised, Google Earth's attribution kept over 0-5.4 s; \
the web: NCSA Advanced Visualization Lab ("Cosmic Bubble Bath"). Ends on the frame \
public/figures/opener_last.jpg is (<WebTakeover>'s still on the next slide)."""

[[videos]]
name      = "cern_footage_2022_013_001_1080p_lhc.mp4"
profile   = "remux"
used_in   = ["deck"]
generated = true
notes     = """\
The real LHC tunnel, CERN-FOOTAGE-2022-013-001 (CERN), the 18 s cut 2:35-2:53 that \
OpenData and Karjera use: the travelling shot with the magnets on the right; on its last \
frame the magnet string vanishes at (0.45, 0.53), where the push goes on. The tunnel's own \
ventilation hum (the slide plays it muted under the music)."""

[[videos]]
