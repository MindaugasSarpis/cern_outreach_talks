# Talk-OWNED clips only. Clips from the slidev-videos library
# (https://github.com/MindaugasSarpis/slidev-videos, src/slidev_videos/shared.toml)
# are inherited by name — reference them in the deck, never list them here.
#
# POLICY (since 2026-07-18): venues play the 1080p H.264 web tier, loudness
# -16 LUFS. No HQ tier. Run `pnpm videos:preflight` before the talk.
# Profiles: remux | standard | standard-tight | silent-loop | high-motion

[defaults]
# release_tag comes from videos.toml (videos-2026-10-00-innoday).
max_size_mb = 320   # vu_ff_zoom 253 MB; vu_ff_zoom_galaxy (4:26, re-encoded from the web copy at ~9.2 Mbit/s) 305 MB

[[videos]]
name    = "vu_ff_zoom.mp4"
profile = "high-motion"
used_in = ["deck"]
notes   = """\
Opener: cosmic zoom-out from the VU Faculty of Physics building in the NFTMC \
(Saulėtekis, Google Earth) through Vilnius, Earth and the Milky Way out to \
a spiral galaxy, which fades to black at the end (it does not end on the cosmic \
web: the takeover slide shows a stand-in frame until the orbit clip replaces \
it), 4:42 with its own audio track. The same web encode \
as the World of Particles opener (release videos-2026-09-10-worldofparticles, \
2026-09-07), copied to this talk's release. Raw is a 4K60 H.264 254 Mbps \
Resolve master (9.0 GB) on gdrive as vu_ff_zoom.mp4."""

[[videos]]
name    = "vu_ff_zoom_galaxy.mp4"
profile = "high-motion"
used_in = ["deck"]
notes   = """\
The opener until the owner's orbit clip exists: vu_ff_zoom.mp4 cut at 4:26, \
before its last 16 s fade to black, so it ends on our galaxy seen from the \
side and the takeover slide can start from that real frame \
(public/figures/opener_last.jpg, pnpm takeover:frame). Made from the 1080p web \
encode (not the raw): ffmpeg -t 266, h264_nvenc VBR ~7 Mbit/s, 3 s audio \
fade-out at the end."""

# The owner's new opener, in preparation: an orbit from VU out to the cosmic web.
# It must END on the cosmic web, held (no fade to black): the next slide opens on
