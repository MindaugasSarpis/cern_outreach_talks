[defaults]
# release_tag comes from videos.toml (videos-2026-10-00-innoday).
max_size_mb = 300   # vu_ff_zoom: 4:42 of 1080p CG at the high-motion ceiling lands near 260 MB

[[videos]]
name    = "vu_ff_zoom.mp4"
profile = "high-motion"
used_in = ["deck"]
