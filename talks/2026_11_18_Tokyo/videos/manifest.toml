# Talk-OWNED clips only. Clips from the slidev-videos library
# (https://github.com/MindaugasSarpis/slidev-videos, src/slidev_videos/shared.toml)
# are inherited by name — reference them in the deck, never list them here.
#
# POLICY (since 2026-07-18): venues play the 1080p H.264 web tier, loudness
# -16 LUFS. No HQ tier. Run `pnpm videos:preflight` before the talk.
# Profiles: remux | standard | standard-tight | silent-loop | high-motion

[defaults]
# release_tag comes from videos.toml (videos-2026-11-18-tokyo).

# [[videos]]
# name    = "example_clip.mp4"
# profile = "standard"
# used_in = ["deck"]
# notes   = "What this clip is and where it came from."

# Both cut 2026-10-27 from Užsikrauk karjerai's vilnius_zoom.mp4 (its raw, the stabilised 49 s
# zoom out from NFTMC in Saulėtekis to the cosmic web, made by that talk's
# scripts/remap_zoom.py from the owner's SpaceEngine edit; see its manifest). Owner, 27 Oct:
# introduce Lithuania; "Show Nagoya / Vilnius on a globe indicate collaboration (maybe after
# zoomout video coming back)". The raws are these cuts, not on gdrive: never run a plain
# videos:sync here (it would delete them); cut them again with the commands below.
[[videos]]
name    = "vilnius_out.mp4"
profile = "high-motion"
used_in = ["deck"]
loudnorm = false
notes   = """\
Slide 2, Lithuania: vilnius_zoom.mp4 0-17.8 s, from NFTMC in Saulėtekis out over Vilnius \
(Google Earth; its logo and the imagery providers, "Landsat / Copernicus", "Airbus, CNES / \
Airbus, Maxar Technologies", are in the footage to 12.5 s) to the clouds and the Earth's limb \
(SpaceEngine), cut before the galaxy's band comes in. No audio. \
ffmpeg -i vilnius_zoom.mp4 -t 17.8 -an -c:v libx264 -preset slow -crf 14 -pix_fmt yuv420p -r 50."""

[[videos]]
name    = "vilnius_back.mp4"
profile = "high-motion"
used_in = ["deck"]
loudnorm = false
notes   = """\
The coming back, before the globe: vilnius_zoom.mp4 40.0 s back to 16.0 s, reversed at twice \
the speed (12.0 s, 50 fps; every second frame of the source, in reverse order), from the cosmic \
web (NCSA Advanced Visualization Lab, "Cosmic Bubble Bath") past the galaxy back to the Earth's \
limb (SpaceEngine). Its last frame is public/figures/earth_back.jpg, the picture <CollabGlobe> \
dissolves onto the globe. No audio. ffmpeg -ss 16 -to 40 -i vilnius_zoom.mp4 -an -vf \
"select='not(mod(n,2))'" -fps_mode vfr frames, then a concat list of them in reverse order at \
0.02 s each, -vf fps=50,format=yuv420p, libx264 -preset slow -crf 14."""

# The LHC tunnel's 18 s cut, on this talk's own release (5 Nov): the shared library lists it only after
# v0.11.0, so the v0.11 player tries this release first and Chromium blocks the miss (ERR_BLOCKED_BY_ORB)
# before it falls back to videos-shared. The raw is the library's own encode, remuxed.
[[videos]]
name     = "cern_footage_2022_013_001_tunnel_cut.mp4"
profile  = "remux"
used_in  = ["deck"]
loudnorm = false
notes    = """\
Slide 3: CERN-FOOTAGE-2022-013-001, the 18 s cut of the LHC tunnel (2:35-2:53), the library's encode \
(slidev-videos videos-shared, cern_footage_2022_013_001_tunnel_cut.mp4) copied here. Played muted."""

# The two heavy scenes, recorded (owner, 27 Oct: "Deploy, make sure it works on a mac. The heavy
# point cloud should be pre-rendered as a video"). Takes of the live slides by slidev-stage-record
# on v0.8.1 (d3d12, 1080p50, h264_nvenc QP 16); the live sources stay in the deck's comments and
# setup/. The raws are these takes, not on gdrive: never a plain videos:sync here; record them
# again with the commands below.
[[videos]]
name    = "globe.mp4"
profile = "high-motion"
used_in = ["deck"]
loudnorm = false
notes   = """\
The globe (setup/globe.js, CollabGlobe.vue), 23 s, no sound (5 Nov, the owner: "the contour of \
the Japan should be central and brightest"; "starting from vilnius to japan and then center on tokyo \
and zoom out"): the Earth's limb picture dissolves into grains onto the globe, close, centred on \
Vilnius; Vilnius, Nagoya and Tokyo light, the strand is drawn, the globe turns along it to Japan \
(the builder's `tour`), centres on Tokyo, and the camera draws back to the whole Earth (the slide's \
`space.path`, dist 7 to 12.5 from 15.5 to 20.5 s). Japan's coastline is Natural Earth 1:10m, the \
brightest contour. pnpm talk record tokyo --out DIR -- --slides 12 --fps 50 --hold 6 --max 40 \
--clicks none (the live slide: <CollabGlobe src="figures/earth_back.jpg" />, no caption, and \
space: { path: [[0, { at: [250, 70, 0], dist: 7, yaw: 0, pitch: 0 }], [15.5, … dist: 7 …], \
[20.5, … dist: 12.5 …]], sway: 0 }), then ffmpeg -ss 0.4 -t 23, libx264 -crf 14."""

[[videos]]
name    = "finale.mp4"
profile = "high-motion"
used_in = ["deck"]
loudnorm = false
notes   = """\
The finale (5 Nov, the owner: "we show this lhcb collision with low bang … then we zoomin, show \
pentaquark being created, and then zoomout to Tokyo"; "pre-record if needed"), 45 s, with its \
sound: LHCb's point cloud at eye level and its collision (Užsikrauk karjerai's close, slide 16, \
11-20 s of its take), the camera pushing into the flash; a white dissolve into Karjera's cover \
(slide 1, its plate: the world alone), whose pentaquark (u u d c c-bar in colour charge) gathers \
out of a crossing's flash, then shrinks to a point; the cosmic web back to the Earth's limb \
(vilnius_back's raw at 1.5x); the globe take (globe.mp4's raw): from Vilnius along the strand to \
Japan, centred on Tokyo, out to the whole Earth. The sound is the shared opening's low bang (components/lhc-opening/sound.js: swell, thump \
on the crossing at 8.0 s, drone, its four-second letting go), rendered offline onto the clip so it \
lands on the frame. Takes: pnpm talk record Karjer --out DIR -- --slides 16 --fps 50 --hold 4 \
--max 32 --clicks none; pnpm talk record Karjer --no-build --out DIR -- --slides 1 --fps 50 --plate \
--hold 14 --max 20 --clicks none. Cut: videos/finale/segments.sh \
and videos/finale/lowbang.py."""

