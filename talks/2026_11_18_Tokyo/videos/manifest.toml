# Talk-OWNED clips only. Clips from the slidev-videos library
# (https://github.com/MindaugasSarpis/slidev-videos, src/slidev_videos/shared.toml)
# are inherited by name — reference them in the deck, never list them here.
#
# POLICY (since 2026-07-18): venues play the 1080p H.264 web tier, loudness
# -16 LUFS. No HQ tier. Run `pnpm videos:preflight` before the talk.
# Profiles: remux | standard | standard-tight | silent-loop | high-motion

[defaults]
# release_tag comes from videos.toml (videos-2026-11-18-tokyo).

# [[videos]]
# name    = "example_clip.mp4"
# profile = "standard"
# used_in = ["deck"]
# notes   = "What this clip is and where it came from."

# Both cut 2026-10-27 from Užsikrauk karjerai's vilnius_zoom.mp4 (its raw, the stabilised 49 s
# zoom out from NFTMC in Saulėtekis to the cosmic web, made by that talk's
# scripts/remap_zoom.py from the owner's SpaceEngine edit; see its manifest). Owner, 27 Oct:
# introduce Lithuania; "Show Nagoya / Vilnius on a globe indicate collaboration (maybe after
# zoomout video coming back)". The raws are these cuts, not on gdrive: never run a plain
# videos:sync here (it would delete them); cut them again with the commands below.
[[videos]]
name    = "vilnius_out.mp4"
profile = "high-motion"
used_in = ["deck"]
loudnorm = false
notes   = """\
Slide 2, Lithuania: vilnius_zoom.mp4 0-17.8 s, from NFTMC in Saulėtekis out over Vilnius \
(Google Earth; its logo and the imagery providers, "Landsat / Copernicus", "Airbus, CNES / \
Airbus, Maxar Technologies", are in the footage to 12.5 s) to the clouds and the Earth's limb \
(SpaceEngine), cut before the galaxy's band comes in. No audio. \
ffmpeg -i vilnius_zoom.mp4 -t 17.8 -an -c:v libx264 -preset slow -crf 14 -pix_fmt yuv420p -r 50."""

[[videos]]
name    = "vilnius_back.mp4"
profile = "high-motion"
used_in = ["deck"]
loudnorm = false
notes   = """\
The coming back, before the globe: vilnius_zoom.mp4 40.0 s back to 16.0 s, reversed at twice \
the speed (12.0 s, 50 fps; every second frame of the source, in reverse order), from the cosmic \
web (NCSA Advanced Visualization Lab, "Cosmic Bubble Bath") past the galaxy back to the Earth's \
limb (SpaceEngine). Its last frame is public/figures/earth_back.jpg, the picture <CollabGlobe> \
dissolves onto the globe. No audio. ffmpeg -ss 16 -to 40 -i vilnius_zoom.mp4 -an -vf \
"select='not(mod(n,2))'" -fps_mode vfr frames, then a concat list of them in reverse order at \
0.02 s each, -vf fps=50,format=yuv420p, libx264 -preset slow -crf 14."""

# The LHC tunnel's 18 s cut, on this talk's own release (5 Nov): the shared library lists it only after
# v0.11.0, so the v0.11 player tries this release first and Chromium blocks the miss (ERR_BLOCKED_BY_ORB)
# before it falls back to videos-shared. The raw is the library's own encode, remuxed.
[[videos]]
name     = "cern_footage_2022_013_001_tunnel_cut.mp4"
profile  = "remux"
used_in  = ["deck"]
loudnorm = false
notes    = """\
Slide 3: CERN-FOOTAGE-2022-013-001, the 18 s cut of the LHC tunnel (2:35-2:53), the library's encode \
(slidev-videos videos-shared, cern_footage_2022_013_001_tunnel_cut.mp4) copied here. Played muted."""

# Two clips of 10 Nov (the owner's review). The raws are made here from the library's masters
# (slidev-videos videos/raw); never a plain videos:sync here; make them again with the commands below.
[[videos]]
name     = "cern_overview_swoosh.mp4"
profile  = "standard"
used_in  = ["deck"]
notes    = """\
Slide 2: the library's cern_overview_short.mp4 (11.24 s, silent; the Earth down to Geneva, the LHC drawn) with a \
zooming swoosh (owner, 10 Nov: "Had have zooming swoosh here"), synthesised by videos/clips/swoosh.py: a soft \
rush as the Earth comes in, the swoosh on the dive through the clouds (4.2-7.4 s). \
python3 videos/clips/swoosh.py swoosh.wav; ffmpeg -i cern_overview_short.mp4 -i swoosh.wav -map 0:v -map 1:a \
-c:v copy -c:a aac -b:a 192k -shortest cern_overview_swoosh.mp4."""

[[videos]]
name     = "atoms_fast.mp4"
profile  = "high-motion"
used_in  = ["deck"]
loudnorm = false
notes    = """\
Slide 5 (owner, 10 Nov: "this slide should be replaced by the sped up zoomin video into the world of atoms"): \
the library's atoms.mp4 (126 s, a hair down to the quarks of a proton) sped up to 26.5 s, no sound: 0-92 s \
at 6x (three frames blended, 50 fps), 92-116.5 s (the nucleus, its protons and neutrons, the proton's quarks \
labelled) at 2.2x; cut before its fade to black. ffmpeg -i atoms.mp4 -filter_complex \
"[0:v]trim=0:92,setpts=(PTS-STARTPTS)/6,tmix=frames=3,fps=50[a];[0:v]trim=92:116.5,setpts=(PTS-STARTPTS)/2.2,fps=50[b];\
[a][b]concat=n=2:v=1:a=0,format=yuv420p[v]" -map "[v]" -an -c:v libx264 -preset slow -crf 14 atoms_fast.mp4."""

# The three heavy scenes, recorded (owner, 27 Oct: "Deploy, make sure it works on a mac. The heavy
# point cloud should be pre-rendered as a video"). Takes of this talk's own stage by
# slidev-stage-record (d3d12, 1080p50), from takes.md, a deck of the scenes alone: how to build it,
# record it and cut the takes is takes/README.md. The raws are those cuts, not on gdrive: never a
# plain videos:sync here.
[[videos]]
name     = "data2019.mp4"
profile  = "high-motion"
used_in  = ["deck"]
loudnorm = false
trim     = ["0:00", "0:24"]
notes    = """\
Slide 10 (owner, 10 Nov: "we want to have a peak from the fit. Also building up the histogram could be a bit more \
substantial, maybe like in uzsikrauk karjerai, something like that (even involving the detector)"): 24 s, no \
sound. LHCb whole, a collision in it, grains leaving the detector and landing as the histogram of the J/ψ p mass \
(HEPData ins1728691, Table 3); the camera comes to the histogram (18.7 s), the fit is drawn and the three peaks \
light. The data take, takes.md slide 2, from 0.8 s. The axis and the peaks' names are the slide's (HTML), placed \
on this clip's last frame."""

[[videos]]
name    = "globe.mp4"
profile = "high-motion"
used_in = ["deck"]
loudnorm = false
notes   = """\
Slide 13 (owner, 10 Nov: "Slide 13 could zoom in and rotate earth"): the globe (setup/globe.js, \
CollabGlobe.vue), 20.6 s, no sound. Grains gather into the globe with Europe in the middle; Vilnius, Nagoya \
and Tokyo light, the strand is drawn from Vilnius to Nagoya; the globe turns east as the camera comes in (to \
15.1 s) and rests on Asia, both cities in the frame. Japan's coastline (Natural Earth 1:10m) is the brightest \
contour. The globe take, takes.md slide 4, from 4.4 s (the photo's dissolve left out)."""

[[videos]]
name    = "finale.mp4"
profile = "high-motion"
used_in = ["deck"]
loudnorm = false
notes   = """\
The finale (10 Nov, the owner: "Reimagine the finale, now it's not good. Use the LHCb collision, use the world \
rendered, maybe the world turns into a pentaquark when zoomed out and then thank you appears in japanese and \
lithuanian"; then "just need a smoother transition from the collision (maybe show more of it, particles \
propagating through detector, something like that)"), 30 s, with its sound: LHCb at eye level and its collision, \
the particles going through the detector as the camera turns round it and draws back (the collision take, \
takes.md slide 3, 1.5-15.1 s); a 1.6 s dissolve at 12.0 s into the world of grains on Japan (the world take, \
takes.md slide 5, from 1.0 s), the camera drawing back to the whole Earth, whose grains leave it from 17.5 s and \
gather into the cover's pentaquark (formed by 23 s). The sound is the shared opening's low bang (lowbang.py: the \
thump on the crossing at 3.9 s, the drone held to 23 s). Cut: videos/finale/segments.sh. The thanks are the \
slide's, not the clip's."""

