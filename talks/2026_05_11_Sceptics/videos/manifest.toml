# Talk-OWNED video assets for this talk. Clips inherited from the shared
# registry (/videos/shared.toml) — like CERN_Overview_Short, Voyage_into_atoms,
# LHCb_Aciu — are NOT listed here; they're served at runtime from the shared
# release via VideoPlayer's fallback chain.
#
# Global defaults live in /outreach.toml; talk-level [defaults] overrides them;
# per-video fields on a [[videos]] block win over both.
#
# Profiles (in scripts/videos.py):
#   remux          - lossless stream copy + faststart. For clips already in a
#                    web-friendly codec (HEVC/H.264 <= ~5 Mbps).
#   standard       - HEVC CRF 24, AAC 128k.
#   standard-tight - HEVC CRF 27 for long clips that blow the size budget.
#   silent-loop    - HEVC CRF 26, audio stripped. Background loops.
#   high-motion    - HEVC CRF 22, AAC 192k. Sims, fast action, CGI.

[defaults]
source_remote = "gdrive:Work/Outreach/Resources/Videos/released"
long_edge_px  = 3840   # venue is 4K 16:9 (3840x2160); override global 1920

# release_tag auto-derives from talk dirname.
# max_size_mb inherited from /outreach.toml.

# g-2 charts — talk-specific renders. The editAI versions are 1800x1000 (9:5);
# Sceptics' venue is 16:9, so the masters should be regenerated at 16:9
# (1920x1080 min, 3840x2160 ideal) before the talk goes live. Until then,
# the existing files in public/videos/ letterbox top/bottom on the venue —
# acceptable for rehearsal, fix before showtime.
[[videos]]
name    = "g2_data.mp4"
profile = "remux"
used_in = ["deck"]
notes   = "Muon g-2 measured-vs-theory chart. REGENERATE at 16:9 from master."

[[videos]]
name    = "g2_fit.mp4"
profile = "remux"
used_in = ["deck"]
notes   = "Muon g-2 fit chart. REGENERATE at 16:9 from master."
