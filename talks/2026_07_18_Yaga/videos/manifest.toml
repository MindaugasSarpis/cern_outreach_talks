# Talk-OWNED video assets for the Yaga talk. Clips inherited from the
# shared registry (/videos/shared.toml) — generic CERN/LHC/B-roll footage,
# the crash-course chart renders, and the editAI-lineage venue clips — are
# NOT listed here; they're served at runtime via VideoPlayer's fallback
# chain from the shared release (see .env: VITE_VIDEO_SHARED_RELEASE).
#
# For OFFLINE/venue use the inherited clips must be made local first:
#   pnpm videos:pull -- --include-shared      # web tier -> public/videos/
#   pnpm videos:pull-hq -- --include-shared   # HQ tier  -> videos/hq/
# then pnpm build:portable.
#
# To override an inherited clip (e.g., re-encode at this venue's 4K width):
# add a [[videos]] entry with the same filename, encode/publish to Yaga's
# own release — the talk release wins VideoPlayer's fallback chain.
#
# Profiles (in scripts/videos.py):
#   remux          - lossless stream copy + faststart. For clips already in a
#                    web-friendly codec (H.264, or low-bitrate HEVC).
#   standard       - web H.264 CRF 23 (<=6 Mbps), AAC 128k.
#   standard-tight - web H.264 CRF 26 (<=3.5 Mbps) for long clips.
#   silent-loop    - web H.264 CRF 24 (<=5 Mbps), audio stripped. Loops.
#   high-motion    - web H.264 CRF 22 (<=8 Mbps), AAC 192k. Sims/CGI/fast.
# (The HQ venue-master tier is HEVC CRF 16 regardless of profile.)

[defaults]
source_remote = "gdrive:work/outreach/resources/videos/released"  # ALL lowercase
long_edge_px  = 3840   # venue is 4K 16:9 (3840x2160); override global 1920
web_long_edge_px = 3840  # 4K venue streams the release web tier too — ship 4K
                         # H.264 web copies; scale=min(...,iw) never upscales,
                         # so sub-4K raws (e.g. skylapse 1080p) stay native

# release_tag auto-derives from talk dirname.
# max_size_mb inherited from /outreach.toml.

# ---------------------------------------------------------------------------
# Yaga venue-specific footage
# ---------------------------------------------------------------------------

[[videos]]
name     = "mountain.mov"
profile  = "high-motion"
used_in  = ["deck"]
encoder  = "videotoolbox"
notes    = """\
Opening mountain aerial (replaces skylapse as slide 1). The 2026-07-17 re-export \
is 4K30 H.264 207 Mbps + 24-bit PCM, 3:07, 4.5 GB. It cannot be hard-linked as \
the master: PCM does not decode in Chrome, so the slide would play silent — and \
this clip is the one carrying edited audio. libx265 would need ~2.8 h at this \
machine's 0.55 fps, so the HQ tier uses Apple's hardware HEVC encoder (~2 min) \
and _hq_audio_args transcodes the PCM to AAC 320k."""

[[videos]]
name        = "lt_zoom.mov"
profile     = "high-motion"
used_in     = ["deck"]
hq_from_raw = true
notes       = """\
Lithuanian-labelled cosmic zoom, rendered in Resolve (H.264 Quality/Best, \
4K60, 6.9 GB raw — actually HEVC 148 Mbps, 6:29). Well over the 2 GB release \
cap, so HQ hard-links the raw per the note's own fallback. A libx265 CRF 16 \
pass is ~11.8 h at this machine's 0.55 fps — not viable; re-encode via \
hardware HEVC if the raw stutters."""

[[videos]]
name        = "atoms.mov"
profile     = "high-motion"
used_in     = ["deck"]
hq_from_raw = true
notes       = """\
CG zoom into atoms (replaces shared voyage_in_to_the_world_of_atoms). Raw is \
1080p HEVC 10.2 Mbps — already a better master than a re-encode would be, so \
HQ hard-links it."""

