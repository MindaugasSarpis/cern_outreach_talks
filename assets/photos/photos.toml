# Photo bank: photos whose licence and credit were checked on their record
# page, so the next talk can reuse them without hunting again.
#
# One [[photo]] per image; every key is required:
#   subject      what the picture shows (with the date, when known)
#   file         assets/photos/<file> (a slug with .jpg or .png)
#   source_url   the record page: https://cds.cern.ch/images/<ID> or
#                https://commons.wikimedia.org/wiki/File:<name>
#                (scripts/photo_fetch.py takes cds:<ID> or commons:File:<name>)
#   licence      as the record states it. "CERN terms (non-commercial)" means
#                CDS's "© CERN, freely available for non-commercial use":
#                fine on these talks' non-commercial site with the credit,
#                but not a free licence and not for redistribution.
#                "© <holder>, all rights reserved" means ask the holder.
#   credit       the line to print on the slide (.credit)
#   verified_on  when the licence and credit were read on the record (YYYY-MM-DD)
#   px           [width, height] of the file as fetched
#
# The image files are not committed yet; scripts/photo_fetch.py fetches
# them. Seeded from the Innoday photo search of 2026-10-07.

